# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci

# Same gates the local lefthook pre-commit runs (golangci-lint + go test -race)
# on every push to main and every PR. Safety net for contributors who forgot
# to install lefthook.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod or go.sum is out of date; run 'go mod tidy' locally and commit."
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        # v7 is required for golangci-lint v2.x configs (v6 only supports v1.x
        # formats). Bump in step with the local tool version.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      - name: Run go test (race)
        run: go test -race -count=1 -timeout 120s ./...

      - name: Build
        # The binary is `pp`; the directory is named pprotector so
        # `go install .../cmd/pprotector` is unambiguous on $PATH.
        run: go build -trimpath -ldflags="-s -w" -o dist/pp ./cmd/pp

  build-matrix:
    # Compile on every supported platform so platform-specific breakage
    # surfaces before a release, not during.
    name: Build ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o dist/pp-${{ matrix.os }}-${{ matrix.arch }} ./cmd/pp
